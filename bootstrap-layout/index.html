<!DOCTYPE html>
<html lang="en">

<head>
  <title>Bootstrap Layout</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container">
    <h1>Bootstrap Layout</h1>
    <p>This is a container.</p>
  </div>


  <div class="container">
    <div class="row">
      <div class="col-md-6 bg-light p-3">
        Column 1
      </div>
      <div class="col-md-6 bg-secondary text-white p-3">
        Column 2
      </div>
    </div>
  </div>

  <div class="col-sm-12 col-md-6 col-lg-4">

    <h2 class="text-center">Welcome</h2>
    <p class="lead text-center">
      This page uses Bootstrap typography.
    </p>

    <img src="https://via.placeholder.com/600x300" class="img-fluid 
    rounded" alt="sample image">


    <table class="table table-striped table-bordered mt-4">
      <tr>
        <th>Name</th>
        <th>Role</th>
      </tr>
      <tr>
        <td>Ali</td>
        <td>Student</td>
      </tr>
      <tr>
        <td>Aisyah</td>
        <td>Developer</td>
      </tr>
    </table>


    <div class="card mt-4" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Bootstrap Card</h5>
        <p class="card-text">This is a simple card component.</p>
        <a href="#" class="btn btn-primary">Read More</a>
      </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">MySite</a>
        <button class="navbar-toggler" type="button" data-bs toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
