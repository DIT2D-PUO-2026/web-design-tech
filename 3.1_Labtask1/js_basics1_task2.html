<body>
    <script>
        let num = prompt("Enter a number:");

        if (num > 10) {
            alert("Number is greater than 10");
        } else {
            alert("Number is 10 or less");

        }

        for (let i = 1; i <= 5; i++) {
            console.log("Count: " + i);

        }
    </script>
