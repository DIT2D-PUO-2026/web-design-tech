<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3.3 Half Coding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

    <h2>Contact Us Form</h2>

    <form id="contactForm" class="mt-4">
        <!-- Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
            <div class="invalid-feedback">Please enter your name.</div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email">
            <div class="invalid-feedback">Please enter a valid email.</div>
        </div>

        <!-- Message -->
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Write your message"></textarea>
            <div class="invalid-feedback">Message must be at least 10 characters.</div>
        </div>

        <button type="submit" class="btn btn-primary">Send</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // TODO: Lengkapkan JavaScript validation di bawah
        const form = document.getElementById('contactForm');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const messageInput = document.getElementById('message');

            const nameValue = nameInput.value.trim();
            const emailValue = emailInput.value.trim();
            const messageValue = messageInput.value.trim();

            const isNameValid = nameValue !== '';
            const isEmailValid = emailValue !== '' && emailValue.includes('@');
            const isMessageValid = messageValue !== '' && messageValue.length >= 10;

            if (isNameValid) {
                nameInput.classList.remove('is-invalid');
                nameInput.classList.add('is-valid');
            } else {
                nameInput.classList.remove('is-valid');
                nameInput.classList.add('is-invalid');
            }

            if (isEmailValid) {
                emailInput.classList.remove('is-invalid');
                emailInput.classList.add('is-valid');
            } else {
                emailInput.classList.remove('is-valid');
                emailInput.classList.add('is-invalid');
            }

            if (isMessageValid) {
                messageInput.classList.remove('is-invalid');
                messageInput.classList.add('is-valid');
            } else {
                messageInput.classList.remove('is-valid');
                messageInput.classList.add('is-invalid');
            }

            if (isNameValid && isEmailValid && isMessageValid) {
                alert('Form submitted!');
                form.reset();

                nameInput.classList.remove('is-valid');
                emailInput.classList.remove('is-valid');
                messageInput.classList.remove('is-valid');
            }
        });
    </script>
</body>

</html>
