<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Responsive Lab</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container mt-4">
        <h2 class="text-center mb-4">Responsive Grid Layout</h2>

        <div class="row text-center">
            <div class="col-12 col-md-6 col-lg-4 bg-light p-3 border">
                Column 1
            </div>
            <div class="col-12 col-md-6 col-lg-4 bg-secondary text-white p-3 border">
                Column 2
            </div>
            <div class="col-12 col-md-6 col-lg-4 bg-light p-3 border">
                Column 3
            </div>
        </div>
    </div>

    <div class="container text-center mt-4">
        <p class="d-block d-md-none text-danger">
            Mobile View
        </p>

        <p class="d-none d-md-block d-lg-none text-warning">
            Tablet View
        </p>

        <p class="d-none d-lg-block text-success">
            Desktop View
        </p>
    </div>

    <div class="container text-center mt-4">
        <h3>Responsive Image</h3>
        <img src="https://pbs.twimg.com/media/G42npREXMAE910g.jpg" class="img-fluid rounded" alt="Responsive Image">
    </div>

    <div class="container mt-4">
        <p class="text-center text-md-start text-lg-end">
            This text changes alignment based on screen size.
        </p>
    </div>

</body>

</html>
