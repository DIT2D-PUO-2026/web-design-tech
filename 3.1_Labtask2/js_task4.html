<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <input type="text" id="name" placeholder="Enter your name">
    <button onclick="showMessage () ">Submit</button>

    <p id="result"></p>

    <script>
        let numl = Number(prompt("Enter first number"));
        let num2 = Number(prompt("Enter second number"));

        let add = numl + num2;
        let sub = numl - num2;
        let mul = numl * num2;

        document.write("Addition: " + add + "<br>");
        document.write("Subtraction: " + sub + "<br>");
        document.write("Multiplication: " + mul);

        let number = prompt("Enter a number");

        for (let i = 1; i <= 5; i++) {
            console.log(number + " x " + i + " = " + (number * i));
        }

        let mark = prompt("Enter your mark");

        if (mark >= 80) {
            alert("Grade: A");
        } else if (mark >= 60) {
            alert("Grade: B");
        } else if (mark >= 40) {
            alert("Grade: C");
        } else {
            alert("Fail");
        }

        function showMessage() {
            let name = document.getElementById("name").value;
            document.getElementById("result").innerHTML =
                "Hello " + name + ", JavaScript is working!";
        }
    </script>
</body>

</html>
