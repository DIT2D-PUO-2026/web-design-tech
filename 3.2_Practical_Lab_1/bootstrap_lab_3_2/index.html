<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Interactive Elements</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#infoModal">
        Open Modal
    </button>

    <div class="modal fade" id="infoModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Information</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    This is a Bootstrap modal dialog.
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <button class="btn btn-success me-3" data-bs-toggle="tooltip" title="Tooltip message">
        Hover Me
    </button>

    <button class="btn btn-warning" data-bs-toggle="popover" title="Popover Title"
        data-bs-content="This is a popover content">
        Click Me</button>

    <div id="myCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
        <ol class="carousel-indicators">
            <li data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></li>
            <li data-bs-target="#myCarousel" data-bs-slide-to="1"></li>
            <li data-bs-target="#myCarousel" data-bs-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="images/1.png" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>First Slide</h5>
                    <p>This is the first slide of the carousel.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="images/2.png" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Second Slide</h5>
                    <p>This is the second slide of the carousel.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="images/3.png" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Third Slide</h5>
                    <p>This is the third slide of the carousel.</p>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
        popoverTriggerList.map(function (popoverTriggerEl) {
            return new bootstrap.Popover(popoverTriggerEl)
        }) 
    </script>


</body>

</html>
