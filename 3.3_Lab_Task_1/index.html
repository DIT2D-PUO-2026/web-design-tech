<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Lab</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">
    <h2>Lab Task 3.3: Form Validation Example</h2>
    <form id="myForm" class="mt-4">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            <div class="invalid-feedback">Sila masukkan username.</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            <div class="invalid-feedback">Sila masukkan email yang sah.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" required minlength="6">
            <div class="invalid-feedback">Password mesti lebih daripada 6 aksara.</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <!-- Bootstrap JS (for modal, tooltip etc.) -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('myForm');
        form.addEventListener('submit', function (e) {
            e.preventDefault(); // block default submit
            let valid = true;
            const username = document.getElementById('username');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            // Username validation
            if (username.value.trim() === '') {
                username.classList.add('is-invalid');
                valid = false;
            } else {
                username.classList.remove('is-invalid');
                username.classList.add('is-valid');
            }
            // Email validation
            if (!email.value.includes('@')) {
                email.classList.add('is-invalid');
                valid = false;
            } else {
                email.classList.remove('is-invalid');
                email.classList.add('is-valid');
            }
            // Password validation
            if (password.value.length < 6) {
                password.classList.add('is-invalid');
                valid = false;
            } else {
                password.classList.remove('is-invalid');
                password.classList.add('is-valid');
            }
            if (valid) {
                const successDiv = document.createElement('div');
                successDiv.className = 'alert alert-success mt-3';
                successDiv.innerText = 'Form submitted successfully!';
                form.appendChild(successDiv);
                setTimeout(() => {
                    form.reset();
                    username.classList.remove('is-valid');
                    email.classList.remove('is-valid');
                    password.classList.remove('is-valid');
                    successDiv.remove();
                }, 2000);
            }
        });
    </script>
</body>

</html>
