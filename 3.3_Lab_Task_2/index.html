<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Form Validation Lab</title>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h2 class="card-title mb-4">Create Account</h2>
                <form id="registrationForm" novalidate>
                    <div class="mb-3"> <label for="username" class="form-label">Username</label> <input type="text"
                            class="form-control" id="username" required minlength="5">
                        <div class="invalid-feedback">Username must be at least 5 characters long.</div>
                    </div>
                    <div class="mb-3"> <label for="email" class="form-label">Email address</label> <input type="email"
                            class="form-control" id="email" required>
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div> <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <div id="successMessage" class="alert alert-success mt-3 d-none"> Form submitted successfully! </div>
            </div>
        </div>
    </div>

    <script>
        // Wait for the DOM to load 
        document.addEventListener('DOMContentLoaded', () => { const form = document.getElementById('registrationForm'); const successMsg = document.getElementById('successMessage');
        
        form.addEventListener('submit', (event) => {
             // 1. Check if the form is valid based on HTML5 attributes 
             if (!form.checkValidity()) {
                // Stop the form from submitting
                event.preventDefault(); event.stopPropagation(); successMsg.classList.add('d-none'); 
            } else {
                    // 2. Perform submission "gracefully"
                    event.preventDefault(); // Stay on page for demo
                    successMsg.classList.remove('d-none');
                    form.reset(); form.classList.remove('was-validated'); // Reset visual state
                    return;
                }

                // 3. Add Bootstrap's validation styles
                form.classList.add('was-validated'); 
            }, false);
         });
    </script>
</body>

</html>
